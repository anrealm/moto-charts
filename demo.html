<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>moto-charts — demo</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #16181d; color: #e6edf3;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  .sub { opacity: .6; font-size: 13px; margin-bottom: 22px; }
  .card { background: #1e2126; border: 1px solid #2b3038; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; opacity: .9; }
  button {
    background: #2f81f7; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: 600 14px/1 inherit; cursor: pointer;
  }
  button.ghost { background: #30363d; }
  button:hover { filter: brightness(1.12); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .legend { display: flex; gap: 20px; font-size: 12px; opacity: .75; margin-top: 10px; justify-content: center; }
  .legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; }
  #diag { font: 12px/1.7 ui-monospace, SFMono-Regular, monospace; opacity: .75; white-space: pre-wrap; }
  .axis text { fill: #8b949e; font: 10px ui-sans-serif, system-ui, sans-serif; }
  .grid line { stroke: #ffffff14; }
</style>
</head>
<body>
<div class="wrap">
  <h1>moto-charts</h1>
  <div class="sub">
    A local demo page. The chart is drawn as a plain SVG &lt;path&gt;, exactly the way
    Highcharts, D3 and the rest do it. The data is invented to exercise the physics:
    two cliffs of different depth, a stepped climb and a spike.
  </div>

  <div class="card">
    <h2>Three series, %</h2>
    <svg id="chart" viewBox="0 0 1120 380" width="100%" height="380" role="img" aria-label="demo chart">
      <g class="grid" id="grid"></g>
      <g class="axis" id="axis"></g>
      <!-- filled area under the line: exercises the closed-path branch of the extractor -->
      <path id="area" fill="rgba(126,231,135,.12)" stroke="none"></path>
      <path id="serie-c" fill="none" stroke="#58a6ff" stroke-width="2"></path>
      <path id="serie-b" fill="none" stroke="#f97583" stroke-width="2"></path>
      <path id="serie-a" fill="none" stroke="#7ee787" stroke-width="2.5" stroke-linejoin="round"></path>
    </svg>
    <div class="legend">
      <span><i style="background:#58a6ff"></i>Series C (flat)</span>
      <span><i style="background:#f97583"></i>Series B</span>
      <span><i style="background:#7ee787"></i>Series A</span>
    </div>
  </div>

  <div class="card">
    <h2>Ride</h2>
    <div class="row">
      <button id="play">Ride the chart</button>
      <button class="ghost" id="playRatio">Straight to the green one</button>
      <button class="ghost" id="diagBtn">Extraction diagnostics</button>
    </div>
    <div id="diag" style="margin-top:14px"></div>
  </div>
</div>

<script src="src/physics.js"></script>
<script src="src/game.js"></script>
<script>
(function () {
  'use strict';

  /*
   * Invented series, authored to exercise the track pipeline: two cliffs of
   * different depth, a stepped climb, a spike and a flat reference line. The
   * shape is chosen for what it does to the physics, not copied from anywhere.
   */
  var LINE_A = [62, 65, 70, 74, 78, 12, 8, 9, 30, 55, 58, 60, 6, 5, 40, 88, 92, 90, 45, 48];
  var LINE_B = [20, 24, 22, 45, 44, 46, 70, 68, 72, 30, 28, 26, 52, 80, 78, 35, 33, 58, 60, 56];
  var LINE_C = LINE_A.map(function () { return 50; });   // flat: must be rejected as a track

  var PAD = { l: 56, r: 30, t: 20, b: 42 };
  var W = 1120, H = 380;
  var plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;

  function xAt(i) { return PAD.l + plotW * i / (LINE_A.length - 1); }
  function yAt(v, max) { return PAD.t + plotH * (1 - v / max); }

  function d(series, max) {
    return series.map(function (v, i) {
      return (i ? 'L' : 'M') + xAt(i).toFixed(1) + ' ' + yAt(v, max).toFixed(1);
    }).join(' ');
  }

  document.getElementById('serie-a').setAttribute('d', d(LINE_A, 100));
  document.getElementById('serie-c').setAttribute('d', d(LINE_C, 100));
  document.getElementById('serie-b').setAttribute('d', d(LINE_B, 100));
  document.getElementById('area').setAttribute('d',
    d(LINE_A, 100) + ' L' + xAt(LINE_A.length - 1).toFixed(1) + ' ' + (PAD.t + plotH) +
    ' L' + xAt(0).toFixed(1) + ' ' + (PAD.t + plotH) + ' Z');

  var grid = document.getElementById('grid'), axis = document.getElementById('axis');
  [0, 50, 100].forEach(function (v) {
    var y = yAt(v, 100);
    var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', PAD.l); ln.setAttribute('x2', W - PAD.r);
    ln.setAttribute('y1', y); ln.setAttribute('y2', y);
    grid.appendChild(ln);
    var tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tx.setAttribute('x', PAD.l - 10); tx.setAttribute('y', y + 3);
    tx.setAttribute('text-anchor', 'end');
    tx.textContent = v + '%';
    axis.appendChild(tx);
  });
  // plain step numbers: a calendar axis would imply a specific reporting period
  LINE_A.forEach(function (_, i) {
    if (i % 2) return;
    var tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    tx.setAttribute('x', xAt(i)); tx.setAttribute('y', H - 16);
    tx.setAttribute('text-anchor', 'middle');
    tx.textContent = String(i + 1);
    axis.appendChild(tx);
  });

  function greenLine() {
    var all = MotoCharts._collectPaths();
    for (var i = 0; i < all.length; i++) {
      if (all[i].el.id === 'serie-a') return all[i];
    }
    return all[0];
  }

  document.getElementById('play').onclick = function () { MotoCharts.start(); };

  document.getElementById('playRatio').onclick = function () {
    var item = greenLine();
    MotoCharts.ride(MotoCharts._samplePath(item, 2), { color: item.color, label: 'Series A' });
  };

  document.getElementById('diagBtn').onclick = function () {
    var all = MotoCharts._collectPaths();
    var lines = all.map(function (c, i) {
      var pts = MotoCharts._samplePath(c, 4);
      var run = MotoPhysics.longestRun(pts);
      var info = '#' + (i + 1) + '  ' + (c.el.id || c.el.tagName) +
        '  len=' + Math.round(c.len) + 'px  bboxW=' + Math.round(c.width) +
        '  samples=' + pts.length + '  usableRun=' + run.length +
        '  stroke=' + c.color;
      try {
        var t = MotoPhysics.buildTrack(pts);
        info += '  ->  track ' + Math.round(t.maxX - t.minX) + 'px / ' + t.points.length + ' pts';
      } catch (e) {
        info += '  ->  UNUSABLE: ' + e.message;
      }
      return info;
    });
    document.getElementById('diag').textContent =
      'paths found: ' + all.length + '\n' + lines.join('\n');
  };

  /* ?picker=1 opens the line picker over the demo chart, for documentation shots. */
  if (/[?&]picker=1/.test(location.search)) {
    MotoCharts.start();
  }

  /*
   * ?colorcheck=1 renders a ride for each series and reads the actual pixels of
   * the drawn track back, so the colour claim is checked against the canvas
   * rather than by eye.
   */
  if (/[?&]colorcheck=1/.test(location.search)) {
    var rows = [];
    ['serie-a', 'serie-b', 'serie-c'].forEach(function (id) {
      var all = MotoCharts._collectPaths();
      var item = null;
      for (var i = 0; i < all.length; i++) if (all[i].el.id === id) item = all[i];
      if (!item) { rows.push(id + ': not found'); return; }

      var g = MotoCharts.ride(MotoCharts._samplePath(item, 2), { color: item.color, label: id });
      g.paused = true;
      g.render();

      /*
       * Sample the right-hand part of the canvas only. The bike sits at 42% of
       * the width, and it is both the brightest thing on screen (white frame)
       * and the most saturated (blue tank) — two earlier versions of this check
       * measured the bike and reported nonsense.
       */
      var W = g.canvas.width, H = g.canvas.height;
      var x0 = Math.round(W * 0.60), x1 = Math.round(W * 0.95);
      var img = g.ctx.getImageData(x0, 0, x1 - x0, H).data;
      var best = null, bestChroma = -1;
      for (var px = 0; px < img.length; px += 4) {
        if (img[px + 3] < 200) continue;
        var r = img[px], gg = img[px + 1], bb = img[px + 2];
        var chroma = Math.max(r, gg, bb) - Math.min(r, gg, bb);
        if (chroma > bestChroma) { bestChroma = chroma; best = [r, gg, bb]; }
      }
      rows.push(id.padEnd(12) + ' source ' + (item.color || '?').padEnd(22) +
        ' drawn rgb(' + best.join(', ') + ')');
      g.destroy();
    });

    var pre = document.createElement('pre');
    pre.style.cssText = 'font:12px/1.7 ui-monospace,monospace;padding:16px;background:#1e2126;' +
      'border-radius:10px;margin:20px 24px;color:#e6edf3;white-space:pre-wrap';
    pre.textContent = 'TRACK COLOUR vs SOURCE LINE COLOUR\n\n' + rows.join('\n');
    document.body.insertBefore(pre, document.body.firstChild);
  }

  /*
   * ?perf=1 times the real render loop at a 3840x2160 backing store — the size a
   * 1920x1080 window occupies on a retina display.
   */
  if (/[?&]perf=1/.test(location.search)) {
    var pitem = greenLine();
    var pg = MotoCharts.ride(MotoCharts._samplePath(pitem, 2), { color: pitem.color, label: 'perf' });
    pg.paused = true;
    pg.w = 1920; pg.h = 1080;
    pg.canvas.width = 3840; pg.canvas.height = 2160;
    pg.ctx.setTransform(2, 0, 0, 2, 0, 0);

    function bench(label) {
      pg.render();
      var t0 = performance.now();
      for (var i = 0; i < 40; i++) { pg.cam.x += 3; pg.render(); }
      return { label: label, ms: (performance.now() - t0) / 40 };
    }
    var rows = [];
    rows.push(bench('with glow (stacked strokes)'));
    pg.glow = false;
    rows.push(bench('without glow'));
    pg.destroy();

    var pre = document.createElement('pre');
    pre.style.cssText = 'font:12px/1.7 ui-monospace,monospace;padding:16px;background:#1e2126;' +
      'border-radius:10px;margin:20px 24px;color:#7ee787;white-space:pre-wrap';
    pre.textContent = 'GAME RENDER at 3840×2160 (40 frames per measurement, 60fps budget = 16.7 ms)\n\n' +
      rows.map(function (r) {
        return r.label.padEnd(34) + r.ms.toFixed(2).padStart(6) + ' ms/frame   ' +
          Math.round(1000 / r.ms) + ' fps ceiling';
      }).join('\n') +
      '\n\nwas 22.85 ms for the line alone with shadowBlur (137% of budget)';
    document.body.insertBefore(pre, document.body.firstChild);
    window.__perf = rows;
  }

  /*
   * ?keytest=1 drives the keyboard handler synthetically: press, release, press
   * again. Reproduces "the throttle stops responding after you let go" without
   * a human at the keyboard.
   */
  if (/[?&]keytest=1/.test(location.search)) {
    var kitem = greenLine();
    var kgame = MotoCharts.ride(MotoCharts._samplePath(kitem, 2), { color: kitem.color, label: 'keytest' });
    kgame.paused = true;
    var log = [];
    function send(type, key) {
      window.dispatchEvent(new KeyboardEvent(type, { key: key, bubbles: true, cancelable: true }));
    }
    function snap(step) {
      log.push(step.padEnd(34) + 'throttle=' + kgame.input.throttle +
        ' tilt=' + kgame.input.tilt + ' brake=' + kgame.input.brake +
        ' keys=' + JSON.stringify(kgame.keys));
    }
    snap('start');
    send('keydown', 'ArrowUp');   snap('1. keydown ArrowUp');
    send('keyup', 'ArrowUp');     snap('2. keyup ArrowUp');
    send('keydown', 'ArrowUp');   snap('3. keydown ArrowUp again');
    send('keyup', 'ArrowUp');     snap('4. keyup ArrowUp');
    send('keydown', 'ArrowDown'); snap('5. keydown ArrowDown');
    send('keyup', 'ArrowDown');   snap('6. keyup ArrowDown');
    send('keydown', 'ArrowUp');   snap('7. keydown ArrowUp third time');
    send('keydown', 'Shift');     snap('8. keydown Shift (brake)');
    send('keyup', 'Shift');       snap('9. keyup Shift');
    snap('final');

    var ok = kgame.input.throttle === 1 && kgame.input.brake === false;
    kgame.destroy();
    var pre = document.createElement('pre');
    pre.style.cssText = 'font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;padding:16px;' +
      'background:#1e2126;border-radius:10px;margin:20px 24px;color:' + (ok ? '#7ee787' : '#f97583');
    pre.textContent = (ok ? 'KEYTEST OK' : 'KEYTEST FAILED') + '\n\n' + log.join('\n');
    document.body.insertBefore(pre, document.body.firstChild);
    window.__keytest = { ok: ok, log: log };
  }

  /*
   * ?auto=<seconds> runs the track headlessly on full throttle and renders the
   * resulting frame immediately, so `firefox --screenshot` captures a real
   * in-game frame instead of an empty canvas.
   */
  var m = /[?&]auto=([\d.]+)/.exec(location.search);
  if (m) {
    var secs = parseFloat(m[1]) || 0;
    var item = greenLine();
    var modeMatch = /[?&]mode=(\w+)/.exec(location.search);
    // &shot=1 dresses the frame for a README screenshot: no debug label and no
    // PAUSED badge, since the loop is stopped rather than paused
    var forShot = /[?&]shot=1/.test(location.search);
    var scaleMatch = /[?&]scale=([\d.]+)/.exec(location.search);
    var game = MotoCharts.ride(MotoCharts._samplePath(item, 2), {
      color: item.color,
      label: forShot ? '' : 'auto ' + secs + 's',
      mode: modeMatch ? modeMatch[1] : undefined,
      scale: scaleMatch ? parseFloat(scaleMatch[1]) : undefined
    });
    game.paused = true; // freeze the rAF loop so only our simulated state shows
    var steps = Math.round(secs * 60);
    for (var i = 0; i < steps; i++) {
      game.input = MotoPhysics.autopilot(game.bike, game.cfg);
      game.update(1 / 60);
    }
    game.input = { throttle: 1, tilt: 0, brake: false };
    if (forShot) { game.paused = false; game.alive = false; }
    game.render();
    window.__autoState = {
      x: Math.round(game.bike.x), maxX: Math.round(game.terrain.maxX),
      crashed: game.bike.crashed, finished: game.bike.finished,
      time: +game.time.toFixed(2), trackPts: game.terrain.points.length
    };
  }
})();
</script>
</body>
</html>
