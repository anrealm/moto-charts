<!doctype html>
<!-- Every way a chart library might specify a line colour, checked against what
     the extractor resolves. Screenshot this headless. -->
<html lang="en"><head><meta charset="utf-8"><title>moto-charts colour cases</title>
<style>body{margin:0;background:#12151c;color:#e6edf3;font:13px/1.6 ui-sans-serif,system-ui,sans-serif}
pre{font:12px/1.8 ui-monospace,SFMono-Regular,monospace;padding:18px 22px;white-space:pre-wrap}
.ok{color:#7ee787}.bad{color:#f97583}
svg{display:block}
.themed{color:#d29922}</style></head>
<body>
<svg id="s" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <linearGradient id="grad"><stop offset="0" stop-color="#ff7b72"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="grad-ref" href="#grad"/>
  </defs>
  <path id="plain"    d="M10 40 L300 90 L600 30 L880 70" fill="none" stroke="#7ee787" stroke-width="2"/>
  <path id="gradient" d="M10 50 L300 100 L600 40 L880 80" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <path id="gradref"  d="M10 60 L300 110 L600 50 L880 90" fill="none" stroke="url(#grad-ref)" stroke-width="2"/>
  <path id="current"  d="M10 70 L300 120 L600 60 L880 100" class="themed" fill="none" stroke="currentColor" stroke-width="2"/>
  <path id="fillonly" d="M10 80 L300 130 L600 70 L880 110 L880 140 L10 140 Z" fill="#a371f7" stroke="none"/>
  <path id="clear"    d="M10 90 L300 140 L600 80 L880 120" fill="none" stroke="rgba(0,0,0,0)" stroke-width="2"/>
</svg>
<pre id="out">…</pre>
<script src="../src/physics.js"></script>
<script src="../src/game.js"></script>
<script>
(function () {
  var expected = {
    plain:    'rgb(126, 231, 135)',
    gradient: 'rgb(255, 123, 114)',   // first stop of the gradient
    gradref:  'rgb(255, 123, 114)',   // gradient inherited via href
    current:  'rgb(210, 153, 34)',    // currentColor from the CSS class
    fillonly: 'rgb(163, 113, 247)',   // no stroke: fall back to fill
    clear:    '#7ee787'               // fully transparent: fall back to default
  };
  var found = {};
  MotoCharts._collectPaths().forEach(function (c) { found[c.el.id] = c.color; });

  var rows = Object.keys(expected).map(function (id) {
    var got = found[id];
    var ok = got === expected[id];
    return '<span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✔' : '✖') + ' ' +
      id.padEnd(10) + 'expected ' + expected[id].padEnd(22) + ' got ' + (got || '— not found') + '</span>';
  });
  var fails = rows.filter(function (r) { return r.indexOf('✖') >= 0; }).length;
  document.getElementById('out').innerHTML =
    'LINE COLOUR RESOLUTION\n\n' + rows.join('\n') +
    '\n\n' + (fails ? '<span class="bad">failures: ' + fails + '</span>'
                    : '<span class="ok">every case resolved correctly</span>');
  window.__colorCases = { found: found, fails: fails };
})();
</script>
</body></html>
